{% extends 'base.html' %}

{% block title %}Perfil{% endblock %}

{% block content %}
<div class="card shadow">
  <div class="card-body">
    <h2 class="h4 mb-3">Perfil de usuario</h2>
    <p><strong>Usuario:</strong> {{ user.username }}</p>
    <p><strong>Nombre:</strong> {{ user.get_full_name|default:'-' }}</p>
    <p><strong>Email:</strong> {{ user.email|default:'-' }}</p>
  </div>
</div>
{% endblock %}
